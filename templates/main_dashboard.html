<!DOCTYPE html>
<html lang="en">
<head>

<body>
<style>
body {
    background-color: white;
    /* margin: 5%;
    padding: 0;
    
    justify-content: center;
    align-items: center;
    height: 100%; */
}
.dropdown {
      position: relative;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 25px;
      left: 0;
      /* background-color: #78bfde; */
      color: #dbd22b;
      min-width: 160px;
      border-radius: 8px;
      overflow: hidden;
      z-index: 100;
    }

    .dropdown-content a {
      display: block;
      color: #FFD700;
      padding: 10px 15px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .dropdown-content a:hover {
      background-color: #e4edf3;
    }

    .dropdown.active .dropdown-content {
      display: block;
    }
</style>    
<nav class="navbar" method="POST" action="/main_dashboard">
        <div class="navbar-container container">
            <input type="checkbox" name="" id="">
            <div class="hamburger-lines">
                <span class="line line1"></span>
                <span class="line line2"></span>
                <span class="line line3"></span>
            </div>
            <ul class="menu-items">
                <li><a href="/Analytics">Home</a></li>
                <!-- <li><a href="/team">Team</a></li>
                <li><a href="/settings">Settings</a></li>
                <li><a href="/payment">Upgrade</a></li> -->
                <li class="dropdown" id="dropdown">
                    <a id="dropdownToggle">Services▾</a>
                    <div class="dropdown-content" id="dropdownmenu">
                        <a href="/menu">Menu</a>
                        <a href="/team">Team</a>
                        <a href="/qr">Generate</a>
                    </div>
                </li>
                <li><a href="/kitchen_dashboard">Orders</a></li>
                <li><a href="/payment">Subscription</a></li>
                <li><a href="/settings">Settings</a></li>

            </ul>
            <h1 class="logo">{{ restaurant_name }}</h1>
        </div>
    </nav>

<script>
    const dropdown = document.getElementById("dropdown");
    const toggle = document.getElementById("dropdownToggle")

    toggle.addEventListener("click", () => {
        dropdown.classList.toggle("active");
    });

    window.addEventListener("click", (e) => {
        if (!dropdown.contains(e.target)) {
            dropdown.classList.remove("active");
        }
    });
</script>

{% block content%}{% endblock %}
</body>
</html>
